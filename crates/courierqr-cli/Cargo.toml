[package]
name = "courierqr"
version = "0.1.0"
description = "CourierQR command line: show encrypted files as animated QR codes, export frames, decode captures."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
courierqr-core = { path = "../courierqr-core", features = ["scan"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
minifb = { version = "0.29.0", optional = true }
qrcode = { version = "0.14.1", default-features = false }
rpassword = "7.5.4"
v4l = { version = "0.14.0", optional = true }
ratatui = "0.30"

[features]
default = ["window", "camera"]
# On-screen sender. Disable (--no-default-features) for headless export/receive only.
window = ["dep:minifb"]
# Webcam receiver via V4L2 (Linux).
camera = ["dep:v4l"]
