[package]
name = "courierqr"
version = "0.1.0"
description = "CourierQR command line: show encrypted files as animated QR codes, export frames, decode captures."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
courierqr-core = { path = "../courierqr-core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
minifb = { version = "0.29.0", optional = true }
qrcode = { version = "0.14.1", default-features = false }
rpassword = "7.5.4"
rxing = { version = "0.9.3", default-features = false, features = ["decoders", "multi_barcode_readers", "encoding_rs", "qrcode"] }

[features]
default = ["window"]
# On-screen sender. Disable (--no-default-features) for headless export/receive only.
window = ["dep:minifb"]
