[package]
name = "courierqr-wasm"
version = "0.1.0"
description = "CourierQR receiver compiled to WebAssembly: QR decode + reassembly + decryption behind a tiny C ABI."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib -> the .wasm the web app loads; rlib -> lets `cargo test` run natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
courierqr-core = { path = "../courierqr-core", features = ["scan"] }
# "custom": on wasm32-unknown-unknown, randomness comes from the page's
# crypto.getRandomValues via an imported function (see `host_random`).
getrandom = { version = "0.2", features = ["custom"] }
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
# examples/scanbench.rs compares detection strategies directly.
rxing = { version = "0.9.3", default-features = false, features = ["decoders", "multi_barcode_readers", "encoding_rs", "qrcode"] }
