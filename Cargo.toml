[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/FletchEm31/CourierQR"

# scrypt (age passphrase mode) is painfully slow unoptimized; optimize deps even in dev/test.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
