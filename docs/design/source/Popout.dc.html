<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
.th-Midnight{--face:#2a2c31;--hi:#5a5e68;--light:#3a3d44;--shadow:#141518;--dark:#000000;--text:#ececec;--dim:#b4b8bf;--field:#111214;--fieldText:#ececec;--t1:#000080;--t2:#1084d0;--tText:#ffffff;--panel:#111214;--panel2:#1b1d22;--logoAccent:#4aa8ff;--logoShadow:#000000;--edition:#ff8a8a;--desk:#0d2b2b;--desk2:#143a3a;--sbTrack:#1d1f23}
.th-Classic{--face:#c0c0c0;--hi:#ffffff;--light:#dfdfdf;--shadow:#808080;--dark:#404040;--text:#000000;--dim:#3d3d3d;--field:#ffffff;--fieldText:#000000;--t1:#000080;--t2:#1084d0;--tText:#ffffff;--panel:#ffffff;--panel2:#eef3fb;--logoAccent:#000080;--logoShadow:#9aa7b8;--edition:#800000;--desk:#008080;--desk2:#0a8f8f;--sbTrack:#dfdfdf}
.th-Amber{--face:#1c1407;--hi:#6b4a12;--light:#3a2a0c;--shadow:#000000;--dark:#000000;--text:#ffb000;--dim:#d99a2b;--field:#0d0903;--fieldText:#ffc640;--t1:#3a2200;--t2:#8a5a00;--tText:#ffd27a;--panel:#0d0903;--panel2:#1a1206;--logoAccent:#ffd27a;--logoShadow:#5a3300;--edition:#ff7a3a;--desk:#140d02;--desk2:#251905;--sbTrack:#140e05}
.th-Phosphor{--face:#0c160c;--hi:#2c5a2c;--light:#173017;--shadow:#000000;--dark:#000000;--text:#4dff7a;--dim:#3fcf66;--field:#050a05;--fieldText:#7dff9e;--t1:#003a10;--t2:#00872a;--tText:#d6ffe0;--panel:#050a05;--panel2:#0a140a;--logoAccent:#b6ffc9;--logoShadow:#003a10;--edition:#e6ff4d;--desk:#020602;--desk2:#0a180a;--sbTrack:#081008}
.th-Synthwave{--face:#1d1233;--hi:#5a3f8f;--light:#2d1d4f;--shadow:#0a0614;--dark:#000000;--text:#f4e9ff;--dim:#c9b6ee;--field:#110a20;--fieldText:#f4e9ff;--t1:#ff2bd6;--t2:#3a2bff;--tText:#ffffff;--panel:#110a20;--panel2:#1d1236;--logoAccent:#00e5ff;--logoShadow:#ff2bd6;--edition:#ffd84d;--desk:#160a2e;--desk2:#2a1252;--sbTrack:#160d29}
.win{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px;line-height:1.35;color:var(--text);background:var(--face)}
.win input[type=radio],.win input[type=checkbox]{accent-color:var(--t2)}
.desk{background-color:var(--desk);background-image:radial-gradient(var(--desk2) 1px,transparent 1px);background-size:6px 6px}
.raised{background:var(--face);border-style:solid;border-width:2px;border-color:var(--hi) var(--dark) var(--dark) var(--hi);box-shadow:inset -1px -1px 0 var(--shadow),inset 1px 1px 0 var(--light)}
.sunken{background:var(--field);border-style:solid;border-width:2px;border-color:var(--shadow) var(--hi) var(--hi) var(--shadow);box-shadow:inset 1px 1px 0 var(--dark)}
.btn{font:inherit;color:var(--text);background:var(--face);border-style:solid;border-width:2px;border-color:var(--hi) var(--dark) var(--dark) var(--hi);box-shadow:inset -1px -1px 0 var(--shadow),inset 1px 1px 0 var(--light);padding:6px 18px;min-height:44px;min-width:120px;cursor:pointer}
.btn:active,.tool:active{border-color:var(--dark) var(--hi) var(--hi) var(--dark)}
.btn.def{outline:2px solid var(--text);outline-offset:0}
.tbtn{font:inherit;font-weight:700;width:30px;height:26px;padding:0;color:var(--text);background:var(--face);border-style:solid;border-width:2px;border-color:var(--hi) var(--dark) var(--dark) var(--hi);cursor:pointer}
.title .tbtn{color:var(--text)}
.tbtn.pressed{border-color:var(--dark) var(--hi) var(--hi) var(--dark);background:var(--light)}
.tool{font:inherit;font-size:12px;color:var(--text);background:var(--face);border:2px solid transparent;min-width:76px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.tool:hover{border-color:var(--hi) var(--dark) var(--dark) var(--hi)}
.tool svg,.tab svg,.legend svg{background:#c0c0c0;padding:2px;border:1px solid #000}
.group{position:relative;border:1px solid var(--shadow);box-shadow:1px 1px 0 var(--hi),inset 1px 1px 0 var(--hi);padding:20px 14px 14px}
.legend{position:absolute;top:-11px;left:10px;background:var(--face);padding:0 6px;font-weight:700;display:flex;align-items:center;gap:6px}
.title{background:linear-gradient(90deg,var(--t1),var(--t2));color:var(--tText);font-weight:700;height:34px;display:flex;align-items:center;gap:10px;padding:0 6px 0 10px}
.tab{font:inherit;color:var(--text);background:var(--face);border-style:solid;border-width:2px 2px 0 2px;border-color:var(--hi) var(--dark) transparent var(--hi);padding:6px 18px;min-height:36px;position:relative;top:2px;cursor:pointer;display:flex;align-items:center;gap:8px}
.tab.on{font-weight:700;padding-top:9px;z-index:2;margin-bottom:-2px}
.status{display:flex;gap:4px;padding:4px}
.pane{border-style:solid;border-width:1px;border-color:var(--shadow) var(--hi) var(--hi) var(--shadow);padding:3px 10px;white-space:nowrap}
.dim{color:var(--dim)}
.field{font:inherit;color:var(--fieldText);background:var(--field);border-style:solid;border-width:2px;border-color:var(--shadow) var(--hi) var(--hi) var(--shadow);box-shadow:inset 1px 1px 0 var(--dark);padding:6px 8px;min-height:40px;box-sizing:border-box}
.sep{border-bottom:1px solid var(--shadow);box-shadow:0 1px 0 var(--hi)}
.sb{width:22px;display:flex;flex-direction:column;background-color:var(--sbTrack);background-image:repeating-conic-gradient(var(--sbTrack) 0 25%,var(--light) 0 50%);background-size:4px 4px}
.sbb{height:22px;display:flex;align-items:center;justify-content:center;font-size:10px;background:var(--face);border-style:solid;border-width:2px;border-color:var(--hi) var(--dark) var(--dark) var(--hi)}
.led{display:inline-block;width:10px;height:10px;border:1px solid #000;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
.bubble{background:#ffffe1;color:#000;border:2px solid #000;padding:12px 14px;box-shadow:4px 4px 0 rgba(0,0,0,.45);position:relative}
.bubble .btn{color:#000;background:#c0c0c0;border-color:#fff #404040 #404040 #fff;box-shadow:inset -1px -1px 0 #808080,inset 1px 1px 0 #dfdfdf}
.ticker{overflow:hidden;flex:1;position:relative}
.ticker>span{display:inline-block;white-space:nowrap;animation:tick 18s linear infinite}
@keyframes tick{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.blink{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
pre{margin:0;font-family:inherit}
label{cursor:pointer}
</style>
</helmet>
